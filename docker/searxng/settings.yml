# SearXNG configuration for CRM EZY
use_default_settings: true
general:
  debug: false
  instance_name: "EZY Digital Search"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  secret_key: "ezy_crm_searxng_secret_key_change_in_prod"
  limiter: false
  image_proxy: false

engines:
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: wikidata
    disabled: true
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
